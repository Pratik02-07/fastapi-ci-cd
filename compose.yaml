services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1  # Forces Python to flush logs instantly to your terminal
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    user: postgres
    volumes:
      - pg-data:/var/lib/postgresql  # Targeted parent dir for Postgres 18+ layout standard
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pg-data:
